services:
  init-data:
    image: alpine:3.20
    command: ["sh", "-c", "chown -R 1000:1000 /data && chown -R 10001:10001 /plugins"]
    networks: [private]
    volumes:
      - msxbridge-data:/data
      - cloudstream-plugins:/plugins
    restart: "no"

  cloudstream-plugin-init:
    image: curlimages/curl:8.12.1
    user: "10001:10001"
    command:
      - sh
      - -ec
      - >-
        curl --fail --location --retry 3 --max-time 60
        https://raw.githubusercontent.com/phisher98/cloudstream-extensions-phisher/builds/MovieBoxProvider.cs3
        --output /plugins/MovieBoxProvider.cs3 &&
        echo '43e4593be338e8c1ebe10ab9043e19cb2c9b79e64dea2c40b5e38d6f84a344e9  /plugins/MovieBoxProvider.cs3' | sha256sum -c -
    volumes:
      - cloudstream-plugins:/plugins
    depends_on:
      init-data:
        condition: service_completed_successfully
    networks: [private]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file:
      - path: ../.env
        required: true
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /var/lib/msxbridge
      WORKER_URL: http://cloudstream-worker:8081
      COMPAT_WORKER_URL: http://cloudstream-compat:8082
    volumes:
      - msxbridge-data:/var/lib/msxbridge
    depends_on:
      init-data:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    networks: [private, seafile-net]
    labels:
      caddy: https://dinmay.dpdns.org
      caddy.tls.key_type: rsa2048
      caddy.@msxbridge_public.path: /msx/start.json /msxbridge/start.json /msxbridge/healthz /msxbridge/d/* /msxbridge/play/*
      caddy.handle: "@msxbridge_public"
      caddy.handle.0_uri: "strip_prefix /msxbridge"
      caddy.handle.1_reverse_proxy: "{{upstreams 3000}}"
    restart: unless-stopped
    mem_limit: 768m

  cloudstream-worker:
    build: ../workers/cloudstream-linux
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    volumes:
      - cloudstream-plugins:/var/lib/msxbridge/plugins
    depends_on:
      init-data:
        condition: service_completed_successfully
    networks: [private]
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  cloudstream-compat:
    profiles: ["cloudstream-compat"]
    build:
      context: ../workers/cloudstream-linux
      dockerfile: Dockerfile.compat
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
      - /home/compat:size=16m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=700
    environment:
      PLUGIN_DIR: /var/lib/msxbridge/plugins
      MOVIEBOX_PLUGIN_FILE: MovieBoxProvider.cs3
      PLUGIN_ALLOWLIST_SHA256: ${PLUGIN_ALLOWLIST_SHA256:-43e4593be338e8c1ebe10ab9043e19cb2c9b79e64dea2c40b5e38d6f84a344e9}
    volumes:
      - cloudstream-plugins:/var/lib/msxbridge/plugins:ro
    depends_on:
      init-data:
        condition: service_completed_successfully
      cloudstream-plugin-init:
        condition: service_completed_successfully
    networks: [private]
    restart: unless-stopped
    mem_limit: 1024m
    pids_limit: 128
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  nuvio-moviebox-bridge:
    profiles: ["cloudstream-compat"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.nuvio-moviebox-bridge
    env_file:
      - path: ../.env
        required: true
    environment:
      PORT: 8090
      COMPAT_WORKER_URL: http://cloudstream-compat:8082
      CLOUDSTREAM_PROVIDER_ID: MovieBoxProvider
      REQUEST_TIMEOUT_MS: 20000
    depends_on:
      cloudstream-compat:
        condition: service_started
    networks: [private, stremio-net]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    mem_limit: 128m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

networks:
  private:
    name: msxbridge-private
  seafile-net:
    external: true
    name: seafile-net
  stremio-net:
    external: true
    name: stremio-net

volumes:
  msxbridge-data:
    name: msxbridge-data
  cloudstream-plugins:
    name: msxbridge-cloudstream-plugins
